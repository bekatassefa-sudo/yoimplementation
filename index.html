<title>Yo Holdings — ERP Implementation</title>

<!--
  ============================================================
  Yo Holdings ERP implementation — questions for department heads
  ============================================================

  Each department's content is encrypted with AES-256-GCM. The key is
  derived in the browser from that department's passphrase using
  PBKDF2-SHA256 at 310,000 iterations. Without the passphrase there is
  nothing readable in this file — not in the page, not in View Source.

  Answers post to Formspree (CONFIG.formEndpoint below). Free tier is
  50 responses a month; if that endpoint ever changes, change it there.

  NOTE: requires https (or localhost). Opening this file directly from
  disk via file:// disables the browser crypto API and the page will
  say so. GitHub Pages serves https, so it works there.

  NEVER put balances, salaries or customer pricing on this site.
  ============================================================
-->

<style>
:root{
  --bg:#f3fbfa; --surface:#ffffff; --surface-2:#e7f6f4;
  --fg:#0f2e2c; --muted:#4f716e; --line:#c7e7e3;
  --accent:#0d9488; --accent-soft:rgba(13,148,136,.10);
  --old:#e4572e; --old-soft:rgba(228,87,46,.08);
  --new:#15a34a; --new-soft:rgba(21,163,74,.09);
  --pop:#f9c74f; --pop-soft:rgba(249,199,79,.22);
  --display:'Bebas Neue',Impact,Haettenschweiler,sans-serif;
  --body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3{margin:0; text-wrap:balance}
p{margin:0}
code{font-family:var(--mono); font-size:.88em; background:var(--surface-2); border:1px solid var(--line); border-radius:3px; padding:1px 5px}

.topbar{background:var(--accent); color:#fff; padding:14px max(18px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px)); display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.topbar .brand{font-family:var(--display); font-size:26px; letter-spacing:1.4px; line-height:1}
.topbar .sub{font-family:var(--mono); font-size:10px; letter-spacing:2px; text-transform:uppercase; opacity:.85}

.shell{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:230px 1fr; gap:26px; padding:26px max(18px,env(safe-area-inset-right,0px)) 60px max(18px,env(safe-area-inset-left,0px))}
.shell > *{min-width:0}
.side{position:sticky; top:20px; align-self:start; min-width:0}
.side .lbl{font-family:var(--mono); font-size:9.5px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin:0 0 9px 4px}
.nav{display:flex; flex-direction:column; gap:3px; background:var(--surface); border:1px solid var(--line); border-radius:7px; padding:7px}
.nav button{display:flex; justify-content:space-between; align-items:center; gap:8px; font-family:var(--body); font-size:13.5px; text-align:left; width:100%; background:transparent; border:0; border-radius:5px; padding:8px 10px; color:var(--muted); cursor:pointer; transition:background .14s,color .14s}
.nav button:hover{background:var(--surface-2); color:var(--fg)}
.nav button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.nav button[aria-current="true"]{background:var(--accent); color:#fff; font-weight:600}
.nav .count{font-family:var(--mono); font-size:10px; min-width:19px; height:19px; border-radius:10px; display:grid; place-items:center; background:var(--pop); color:#3a2d00; flex:none; font-weight:600}
.nav button[aria-current="true"] .count{background:#fff; color:var(--accent)}
.nav .count.zero{background:var(--surface-2); color:var(--muted)}
.nav button[aria-current="true"] .count.zero{background:rgba(255,255,255,.3); color:#fff}

.dept-head{margin-bottom:20px}
.dept-head .eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:2.4px; text-transform:uppercase; color:var(--accent)}
.dept-head h1{font-family:var(--display); font-size:clamp(34px,5.5vw,52px); letter-spacing:1px; line-height:.98; color:var(--accent); margin-top:5px}
.dept-head .who{font-size:14.5px; color:var(--muted); margin-top:7px}

.empty{background:var(--surface); border:1px dashed var(--line); border-radius:7px; padding:30px 26px; text-align:center}
.empty p{color:var(--muted); font-size:14.5px; max-width:48ch; margin:0 auto}

/* passphrase gate */
.gate{background:var(--surface); border:2px solid var(--accent); border-radius:8px; padding:30px 28px; max-width:520px; box-shadow:0 4px 20px rgba(13,148,136,.10)}
.gate .lock{font-family:var(--display); font-size:28px; letter-spacing:1px; color:var(--accent); line-height:1}
.gate p{font-size:14.5px; color:var(--muted); margin-top:9px}
.gate .row{display:flex; gap:9px; margin-top:18px; flex-wrap:wrap}
.gate input{flex:1 1 220px; min-width:0; font-family:var(--mono); font-size:15px; color:var(--fg); background:var(--surface-2); border:1px solid var(--line); border-radius:5px; padding:12px 13px}
.gate input:focus{outline:2px solid var(--accent); outline-offset:-1px}
.gate .msg{font-size:13.5px; margin-top:11px; min-height:19px}
.gate .msg.err{color:var(--old); font-weight:600}
.gate .msg.busy{color:var(--muted)}

.btn{font-family:var(--mono); font-size:11.5px; letter-spacing:1.5px; text-transform:uppercase; font-weight:500; background:var(--accent); color:#fff; border:2px solid var(--accent); border-radius:5px; padding:12px 22px; cursor:pointer; transition:opacity .14s}
.btn:hover{opacity:.9}
.btn:focus-visible{outline:2px solid var(--fg); outline-offset:2px}
.btn[disabled]{opacity:.45; cursor:not-allowed}

.qcard{background:var(--surface); border:1px solid var(--line); border-radius:8px; margin-bottom:22px; overflow:hidden; box-shadow:0 2px 12px rgba(13,148,136,.07)}
.qcard > .qh{padding:17px 22px; background:var(--surface-2); border-bottom:1px solid var(--line)}
.qcard .qmeta{font-family:var(--mono); font-size:9.5px; letter-spacing:1.8px; text-transform:uppercase; color:var(--muted)}
.qcard .qt{font-family:var(--display); font-size:27px; letter-spacing:.8px; line-height:1.05; margin-top:4px}
.qbody{padding:22px}
.qbody > * + *{margin-top:14px}
.qbody h3{font-family:var(--display); font-size:22px; letter-spacing:.9px; margin-top:26px}
.qbody p{font-size:15.5px; max-width:70ch}
.qbody .note{background:var(--surface-2); border-left:5px solid var(--pop); border-radius:5px; padding:15px 18px}

.acct{border:1px solid var(--line); border-radius:6px; overflow:hidden}
.acct .hd{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:11px 15px; background:var(--old-soft); border-bottom:1px solid var(--line); flex-wrap:wrap}
.acct .hd .t{font-family:var(--mono); font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase; color:var(--old)}
.acct .hd .n{font-family:var(--display); font-size:27px; color:var(--old); line-height:1}
.acct ul{list-style:none; margin:0; padding:0}
.acct li{display:grid; grid-template-columns:142px 1fr; gap:11px; padding:5px 15px; font-size:12.5px; border-top:1px solid var(--line)}
.acct li:first-child{border-top:0}
.acct li code{background:none; border:0; padding:0; color:var(--muted)}
.acct li.bad{background:var(--pop-soft)}
.acct li.bad span{color:var(--old); font-weight:600}
.acct .ft{padding:10px 15px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); background:var(--surface-2)}

.line{border:2px solid var(--new); border-radius:6px; padding:16px 18px; background:var(--new-soft)}
.line .lbl{font-family:var(--mono); font-size:9.5px; letter-spacing:1.8px; text-transform:uppercase; color:var(--new); margin-bottom:11px}
.tags{display:flex; flex-wrap:wrap; gap:8px}
.tag{border:1px solid var(--line); border-radius:4px; padding:8px 12px; background:var(--surface); min-width:0}
.tag .k{font-family:var(--mono); font-size:8.5px; letter-spacing:1.3px; text-transform:uppercase; color:var(--muted); display:block}
.tag .v{font-size:13px; font-weight:600}
.tag.acc{border-color:var(--accent); background:var(--accent-soft)}
.tag.acc .v{color:var(--accent)}

.picker .qs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:13px}
.picker .qs button{font-family:var(--body); font-size:12.5px; text-align:left; background:var(--surface); color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:8px 12px; cursor:pointer}
.picker .qs button:hover{border-color:var(--accent); color:var(--fg)}
.picker .qs button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.cmp{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.pane{border:1px solid var(--line); border-radius:6px; padding:14px 16px; min-width:0; font-size:13.5px}
.pane.old{background:var(--old-soft); border-color:var(--old)}
.pane.new{background:var(--new-soft); border-color:var(--new)}
.pane .ph{font-family:var(--mono); font-size:9.5px; letter-spacing:1.7px; text-transform:uppercase; margin-bottom:8px}
.pane.old .ph{color:var(--old)}
.pane.new .ph{color:var(--new)}

.gains{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:12px}
.gain{border:1px solid var(--line); border-top:4px solid var(--new); border-radius:6px; padding:14px 16px}
.gain .t{font-family:var(--mono); font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--new); margin-bottom:6px}
.gain p{font-size:13px; color:var(--muted); max-width:none}
.gain strong{color:var(--fg)}
.cost{border:1px solid var(--line); border-left:5px solid var(--old); border-radius:6px; padding:16px 18px}
.cost .t{font-family:var(--mono); font-size:9.5px; letter-spacing:1.7px; text-transform:uppercase; color:var(--old); margin-bottom:9px}

.answer{border-top:2px solid var(--accent); background:var(--accent-soft); padding:22px}
.answer .ah{font-family:var(--display); font-size:24px; letter-spacing:.9px; color:var(--accent)}
.answer .asub{font-size:14.5px; color:var(--muted); margin-top:5px; max-width:62ch}
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); gap:13px; margin-top:17px}
.opt{display:block; text-align:left; width:100%; cursor:pointer; background:var(--surface); border:2px solid var(--line); border-radius:7px; padding:16px 18px; font-family:var(--body); transition:border-color .14s,box-shadow .14s}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 3px 14px rgba(13,148,136,.2)}
.opt[aria-pressed="true"]::after{content:"\2713 selected"; display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); margin-top:11px}
.opt .oh{font-family:var(--display); font-size:21px; letter-spacing:.9px; line-height:1; color:var(--accent)}
.opt .od{font-size:13.5px; color:var(--muted); margin-top:7px}

.fields{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:17px}
.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.field label{font-family:var(--mono); font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted)}
.field input,.field textarea{font-family:var(--body); font-size:14.5px; color:var(--fg); background:var(--surface); border:1px solid var(--line); border-radius:5px; padding:10px 12px; width:100%}
.field textarea{min-height:76px; resize:vertical}
.field input:focus,.field textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
.send{display:flex; align-items:center; gap:14px; margin-top:16px; flex-wrap:wrap}
.status{font-size:13.5px; min-width:0}
.status.ok{color:var(--new); font-weight:600}
.status.err{color:var(--old); font-weight:600}
.status.warn{color:var(--old)}
.done{background:var(--new-soft); border:2px solid var(--new); border-radius:7px; padding:20px 22px; margin-top:17px}
.done .dh{font-family:var(--display); font-size:22px; letter-spacing:.9px; color:var(--new)}
.done p{font-size:14.5px; color:var(--muted); margin-top:6px}

.pagefoot{max-width:1180px; margin:0 auto; padding:0 max(18px,env(safe-area-inset-right,0px)) 50px max(18px,env(safe-area-inset-left,0px)); font-size:12px; color:var(--muted)}

@media (max-width:860px){
  .shell{grid-template-columns:1fr; gap:18px}
  .side{position:static}
  .nav{flex-direction:row; overflow-x:auto; padding:6px; min-width:0; max-width:100%; -webkit-overflow-scrolling:touch}
  .nav button{white-space:nowrap; flex:0 0 auto}
  .qbody,.answer{padding:18px 16px}
  .qcard .qh{padding:15px 16px}
  .cmp,.fields,.opts{grid-template-columns:1fr}
  .acct li{grid-template-columns:1fr; gap:1px; padding:7px 14px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>

(function(){
  var nav=document.getElementById('nav'), main=document.getElementById('main'), foot=document.getElementById('foot');
  var opened={};   // dept id -> decrypted questions array

  function b64(s){ var r=atob(s), a=new Uint8Array(r.length); for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i); return a; }
  function cryptoOK(){ return !!(window.crypto && window.crypto.subtle); }
  function configured(){ return CONFIG.formEndpoint && CONFIG.formEndpoint.indexOf('formspree.io/f/')!==-1; }
  function nq(id){ var v=VAULT[id]; return v? v.n : 0; }

  async function unlock(id, pass){
    var v=VAULT[id];
    var base=await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key=await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(v.s), iterations:CONFIG.iterations, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    var pt=await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(v.i) }, key, b64(v.c));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  DEPARTMENTS.forEach(function(d){
    var n=nq(d.id);
    var b=document.createElement('button'); b.type='button';
    b.innerHTML='<span>'+d.name+'</span>';
    var c=document.createElement('span');
    c.className='count'+(n?'':' zero'); c.textContent=String(n);
    c.title=n+' open question'+(n===1?'':'s');
    b.appendChild(c);
    b.addEventListener('click', function(){ go(d.id); });
    nav.appendChild(b);
  });

  function go(id){
    var d=DEPARTMENTS.filter(function(x){return x.id===id;})[0]||DEPARTMENTS[0];
    DEPARTMENTS.forEach(function(x,i){ nav.children[i].setAttribute('aria-current', String(x.id===d.id)); });
    if(location.hash.slice(1)!==d.id){ try{history.replaceState(null,'','#'+d.id);}catch(e){} }
    render(d); window.scrollTo(0,0);
  }

  function header(d){
    var h=document.createElement('div'); h.className='dept-head';
    h.innerHTML='<div class="eyebrow">Department</div><h1>'+d.name+'</h1>'+(d.head?'<p class="who">'+d.head+'</p>':'');
    return h;
  }

  function render(d){
    main.textContent=''; main.appendChild(header(d));
    if(!nq(d.id)){
      var e=document.createElement('div'); e.className='empty';
      e.innerHTML='<p>No questions for '+d.name+' yet. They will appear here as they come up during the build, and you will get a link when there is something to answer.</p>';
      main.appendChild(e); return;
    }
    if(opened[d.id]){ opened[d.id].forEach(function(q){ main.appendChild(card(q,d)); }); return; }
    main.appendChild(gate(d));
  }

  function gate(d){
    var g=document.createElement('div'); g.className='gate';
    var n=nq(d.id);
    g.innerHTML='<div class="lock">Passphrase needed</div>'
      +'<p>'+n+' question'+(n===1?'':'s')+' for '+d.name+'. The content is encrypted — enter the passphrase you were given to read it.</p>';
    var row=document.createElement('div'); row.className='row';
    var inp=document.createElement('input');
    inp.type='password'; inp.autocomplete='off'; inp.spellcheck=false;
    inp.placeholder='five-words-and-a-number';
    inp.setAttribute('aria-label','Passphrase for '+d.name);
    var btn=document.createElement('button'); btn.className='btn'; btn.type='button'; btn.textContent='Unlock';
    row.appendChild(inp); row.appendChild(btn); g.appendChild(row);
    var msg=document.createElement('div'); msg.className='msg'; g.appendChild(msg);

    if(!cryptoOK()){
      msg.className='msg err';
      msg.textContent='This browser cannot decrypt from a local file. Open the page over https instead.';
      inp.disabled=true; btn.disabled=true;
      return g;
    }

    function tryIt(){
      var p=inp.value.trim();
      if(!p){ msg.className='msg err'; msg.textContent='Enter the passphrase.'; return; }
      btn.disabled=true; msg.className='msg busy'; msg.textContent='Checking…';
      unlock(d.id,p).then(function(qs){
        opened[d.id]=qs; render(d);
      }).catch(function(){
        btn.disabled=false; msg.className='msg err';
        msg.textContent='That passphrase does not match. Check for typos, or ask for it again.';
        inp.select();
      });
    }
    btn.addEventListener('click', tryIt);
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter') tryIt(); });
    setTimeout(function(){ inp.focus(); },60);
    return g;
  }

  function card(q,d){
    var wrap=document.createElement('div'); wrap.className='qcard';
    var h=document.createElement('div'); h.className='qh';
    h.innerHTML='<div class="qmeta">Question '+q.id.toUpperCase()+' · asked '+q.asked+'</div><div class="qt">'+q.title+'</div>';
    wrap.appendChild(h);
    var body=document.createElement('div'); body.className='qbody'; body.innerHTML=q.body;
    wrap.appendChild(body);
    if(q.pickerData) initPicker(body,q.pickerData);
    wrap.appendChild(answerBlock(q,d));
    return wrap;
  }

  function initPicker(scope,data){
    var p=scope.querySelector('[data-picker]'); if(!p) return;
    var bar=p.querySelector('.qs'), oldB=p.querySelector('.pane.old .body'), newB=p.querySelector('.pane.new .body');
    data.forEach(function(item,i){
      var b=document.createElement('button'); b.type='button'; b.textContent=item.q;
      b.setAttribute('aria-pressed', String(i===0));
      b.addEventListener('click', function(){
        Array.prototype.forEach.call(bar.children,function(x,j){ x.setAttribute('aria-pressed',String(j===i)); });
        oldB.innerHTML=item.old; newB.innerHTML=item.neu;
      });
      bar.appendChild(b);
    });
    oldB.innerHTML=data[0].old; newB.innerHTML=data[0].neu;
  }

  function answerBlock(q,d){
    var a=document.createElement('div'); a.className='answer'; var chosen=null;
    var hd=document.createElement('div');
    hd.innerHTML='<div class="ah">Your answer</div><p class="asub">'+q.prompt+'</p>';
    a.appendChild(hd);

    var opts=document.createElement('div'); opts.className='opts';
    q.options.forEach(function(o){
      var b=document.createElement('button'); b.type='button'; b.className='opt';
      b.setAttribute('aria-pressed','false');
      b.innerHTML='<div class="oh">'+o.h+'</div><div class="od">'+o.d+'</div>';
      b.addEventListener('click', function(){
        chosen=o;
        Array.prototype.forEach.call(opts.children,function(x){ x.setAttribute('aria-pressed','false'); });
        b.setAttribute('aria-pressed','true');
        status.textContent=''; status.className='status'; send.disabled=false;
      });
      opts.appendChild(b);
    });
    a.appendChild(opts);

    var fields=document.createElement('div'); fields.className='fields';
    fields.innerHTML='<div class="field"><label for="'+q.id+'-name">Your name</label>'
      +'<input id="'+q.id+'-name" type="text" autocomplete="name" placeholder="So we know who answered"></div>'
      +'<div class="field"><label for="'+q.id+'-note">Anything to add (optional)</label>'
      +'<textarea id="'+q.id+'-note" placeholder="Concerns, conditions, or a different answer entirely"></textarea></div>';
    a.appendChild(fields);

    var row=document.createElement('div'); row.className='send';
    var send=document.createElement('button'); send.type='button'; send.className='btn';
    send.textContent='Send answer'; send.disabled=true;
    var status=document.createElement('span'); status.className='status';
    row.appendChild(send); row.appendChild(status); a.appendChild(row);

    if(!configured()){
      status.className='status warn';
      status.textContent='Form endpoint not set yet — see the notes at the top of this file.';
    }

    send.addEventListener('click', function(){
      if(!chosen) return;
      var name=document.getElementById(q.id+'-name').value.trim();
      var note=document.getElementById(q.id+'-note').value.trim();
      if(!name){ status.className='status err'; status.textContent='Please add your name first.'; return; }
      if(!configured()){ status.className='status warn'; status.textContent='Cannot send: the form endpoint has not been configured.'; return; }
      send.disabled=true; status.className='status'; status.textContent='Sending…';
      fetch(CONFIG.formEndpoint,{
        method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body: JSON.stringify({
          project: CONFIG.project, department: d.name,
          question_id: q.id, question: q.title,
          answer: chosen.k, answer_text: chosen.h,
          comment: note||'(none)',
          answered_by: name, answered_at: new Date().toISOString()
        })
      }).then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status);
        a.textContent='';
        var done=document.createElement('div'); done.className='done';
        done.innerHTML='<div class="dh">Thank you, '+name.replace(/[<>&]/g,'')+'</div>'
          +'<p>Your answer — <strong>'+chosen.k+'</strong> — has been recorded and sent through. Nothing else is needed from you on this question.</p>';
        a.appendChild(done);
      }).catch(function(){
        send.disabled=false; status.className='status err';
        status.textContent='Could not send. Please check your connection and try again.';
      });
    });
    return a;
  }

  var total=DEPARTMENTS.reduce(function(s,d){ return s+nq(d.id); },0);
  foot.textContent='Content is encrypted per department. '+total+' question'+(total===1?'':'s')
    +' open across '+DEPARTMENTS.length+' departments.';

  window.addEventListener('hashchange', function(){ go(location.hash.slice(1)||DEPARTMENTS[0].id); });
  go(location.hash.slice(1)||DEPARTMENTS[0].id);
})();
</script>
